# ─────────────────────────────────────────────────────────────────────────
#  hyprlock — omarchy-minimal
#
#  Just a blurred wallpaper and a centered password field. Nothing else.
#
# ─────────────────────────────────────────────────────────────────────────

$mono = JetBrainsMono Nerd Font Mono

# ── palette (ice) ─────────────────────────────────────────────────────────
$ice       = rgba(228, 236, 246, 1)
$ice_dim   = rgba(228, 236, 246, 0.52)
$ice_faint = rgba(228, 236, 246, 0.20)
$accent    = rgba(120, 169, 255, 1)
$accent_lo = rgba(120, 169, 255, 0.40)
$glass     = rgba(9, 12, 19, 0.55)
$good      = rgba(120, 220, 170, 1)
$bad       = rgba(255, 128, 128, 1)

# ── behaviour ────────────────────────────────────────────────────────────
general {
    hide_cursor        = true
    ignore_empty_input = true
    immediate_render   = true
    text_trim          = true
    no_fade_in         = true
    grace              = 0
}

animations {
    enabled = false
}

# ── background ────────────────────────────────────────────────────────────
background {
    monitor =

    path  = ~/.cache/hyprlock_wallpaper
    color = rgba(9, 12, 19, 1)

    blur_passes = 3
    blur_size   = 8
    brightness  = 0.52
    contrast    = 1.18
    noise       = 0.035

    zindex = 0
}

# ── prompt ────────────────────────────────────────────────────────────────
input-field {
    monitor =
    size = 420, 56

    outline_thickness = 2
    outer_color       = $accent $accent_lo 0deg
    inner_color       = $glass
    font_color        = $ice

    font_family = $mono
    rounding    = 5

    dots_size        = 0.28
    dots_spacing     = 0.5
    dots_rounding    = 4
    dots_center      = true
    dots_text_format = ●

    placeholder_text = PASSWORD
    fade_on_empty    = false
    fade_timeout     = 250

    check_color = $good
    fail_color  = $bad
    check_text  = IDENTITY VERIFIED
    fail_text   = ACCESS DENIED — RETRY

    capslock_color = $accent
    numlock_color  = $ice_dim
    bothlock_color = $bad

    position = 0, 0
    halign   = center
    valign   = center
}
