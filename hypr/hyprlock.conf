$font = JetBrainsMono Nerd Font

$text_color = rgba(242, 244, 248, 0.95)
$text_color_sub = rgba(242, 244, 248, 0.70)
$accent_color = rgba(198, 160, 246, 1.0)
$accent_color_alpha = rgba(198, 160, 246, 0.35)
$error_color = rgba(237, 135, 150, 1.0)
$inner_color = rgba(18, 18, 18, 0.65)

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
    no_fade_in = false
    no_fade_out = false
}

background {
    monitor =
    path = /home/xaccefy/.cache/hyprlock_wallpaper
    color = rgba(17, 17, 27, 1.0)
    blur_passes = 2
    blur_size = 4
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 2, linear
    animation = fadeOut, 1, 2, linear
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $text_color
    font_size = 90
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 300
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
}

# Date
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B")"
    color = $text_color_sub
    font_size = 20
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 220
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.5)
}

# Avatar
image {
    monitor =
    path = /home/xaccefy/.face
    size = 110
    rounding = -1
    border_size = 3
    border_color = $accent_color
    rotate = 0
    position = 0, 75
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.4)
}

# Username
label {
    monitor =
    text = $USER
    color = $text_color
    font_size = 16
    font_family = JetBrainsMono Nerd Font SemiBold
    position = 0, -5
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.4)
}

# Password Input
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    outer_color = $accent_color_alpha
    inner_color = $inner_color
    font_color = $text_color
    fade_on_empty = false
    placeholder_text = <i><span foreground="##f2f4f8ba">Password...</span></i>
    hide_input = false
    rounding = 0
    fail_color = $error_color
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 200
    capslock_color = $accent_color
    numlock_color = -1
    bothlock_color = -1
    position = 0, -80
    halign = center
    valign = center
}

# Layout
label {
    monitor =
    text = 󰌌  $LAYOUT
    color = $text_color_sub
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 30, 20
    halign = left
    valign = bottom
}

# Battery
label {
    monitor =
    text = cmd[update:5000] echo "$([ "$(cat /sys/class/power_supply/BAT0/status)" = "Charging" ] && echo '󱐋 ')$(cat /sys/class/power_supply/BAT0/capacity)% 󰁹"
    color = $text_color_sub
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = -30, 20
    halign = right
    valign = bottom
}
