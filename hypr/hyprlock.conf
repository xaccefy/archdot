$font = JetBrainsMono Nerd Font Mono
$text_color = rgba(242, 244, 248, 0.92)
$text_color_sub = rgba(242, 244, 248, 0.55)
$accent_color = rgba(120, 169, 255, 1.0)
$accent_color_alpha = rgba(120, 169, 255, 0.28)
$error_color = rgba(237, 135, 150, 1.0)
$inner_color = rgba(18, 18, 18, 0.55)

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

background {
    monitor =
    path = /home/xaccefy/.cache/hyprlock_wallpaper
    color = rgba(17, 17, 27, 1.0)
    blur_passes = 1
    blur_size = 2
    noise = 0.0117
    contrast = 0.90
    brightness = 0.82
    vibrancy = 0.12
    vibrancy_darkness = 0.0
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 0
    animation = fadeOut, 1, 2, linear
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $text_color
    font_size = 64
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 120
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.35)
}

input-field {
    monitor =
    size = 260, 42
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.32
    dots_center = true
    dots_rounding = -1
    outer_color = $accent_color_alpha
    inner_color = $inner_color
    font_color = $text_color
    fade_on_empty = true
    placeholder_text = <span foreground="##f2f4f8a0">  </span>
    hide_input = false
    rounding = 12
    fail_color = $error_color
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $accent_color
    numlock_color = $accent_color
    bothlock_color = $accent_color
    check_color = $accent_color
    check_text = <i>Checking…</i>
    position = 0, -20
    halign = center
    valign = center
}
