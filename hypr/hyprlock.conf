# ─────────────────────────────────────────────────────────────────────────
#  hyprlock — frosted editorial lock screen
#
#  Hierarchy   clock → tracked date → prompt → status
#  Colour      one accent (ice blue, matched to the wallpaper's steel tones)
#              plus three opacities of ice white. Nothing else.
#  Separators  hairlines drawn in-box; they carry the structure, so no
#              widget needs a heavy border or a large drop shadow.
#
# ─────────────────────────────────────────────────────────────────────────

$mono = JetBrainsMono Nerd Font Mono

# ── palette ───────────────────────────────────────────────────────────────
$ice       = rgba(228, 236, 246, 1)      # primary type
$ice_dim   = rgba(228, 236, 246, 0.52)   # secondary type
$ice_faint = rgba(228, 236, 246, 0.20)   # hairlines, inactive chrome
$accent    = rgba(150, 196, 255, 1)      # focus ring, caps lock
$accent_lo = rgba(94, 140, 210, 0.40)    # far end of the border gradient
$glass     = rgba(9, 12, 19, 0.55)       # prompt fill over blurred wallpaper
$good      = rgba(120, 220, 170, 1)
$bad       = rgba(255, 128, 128, 1)

# ── behaviour ─────────────────────────────────────────────────────────────
general {
    hide_cursor        = true
    ignore_empty_input = true
    immediate_render   = true
    text_trim          = true
}

animations {
    enabled = false
    bezier  = expoOut, 0.16, 1, 0.3, 1
    bezier  = softOut, 0.33, 1, 0.68, 1

    animation = fadeIn,         1, 6, expoOut
    animation = fadeOut,        1, 4, softOut
    animation = inputFieldDots, 1, 6, expoOut
}

# ── background ────────────────────────────────────────────────────────────
# Three passes at size 8 turn the wallpaper into frosted glass; the contrast
# bump plus low brightness keep type legible on any image. A little noise
# dithers the gradients, which otherwise band badly on a blurred source.
background {
    monitor =

    path  = ~/.cache/hyprlock_wallpaper
    color = rgba(9, 12, 19, 1)     # behind the image while it decodes

    blur_passes = 3
    blur_size   = 8
    brightness  = 0.52
    contrast    = 1.18
    noise       = 0.035

    zindex = 0
}

# ── clock ─────────────────────────────────────────────────────────────────
# weight="light" rather than a "…Mono Light" family: fontconfig resolves
# that string to the proportional Nerd Font fallback instead.
label {
    monitor =
    text  = $TIME
    color = $ice

    font_family = $mono
    font_size   = 128

    shadow_passes = 3
    shadow_size   = 10
    shadow_color  = rgba(0, 0, 0, 0.45)
    shadow_boost  = 1.1

    position   = 0, 215
    halign     = center
    valign     = center
    text_align = center
}

# ── hairline above the clock ──────────────────────────────────────────────
label {
    monitor =
    text  = ──────────────
    color = $ice_faint

    font_family = $mono
    font_size   = 14

    position   = 0, 318
    halign     = center
    valign     = center
    text_align = center
}

# ── date ──────────────────────────────────────────────────────────────────
label {
    monitor =
    text  = cmd[update:60000] printf '%s' "$(LC_TIME=C date +'%^A · %d %^B %Y')"
    color = $ice_dim

    font_family = $mono
    font_size   = 17

    position   = 0, 110
    halign     = center
    valign     = center
    text_align = center
}

# ── prompt ────────────────────────────────────────────────────────────────
input-field {
    monitor =
    size = 420, 56

    outline_thickness = 2
    outer_color       = $accent $accent_lo 0deg
    inner_color       = $glass
    font_color        = $ice

    font_family = $mono
    rounding    = 5

    dots_size       = 0.28
    dots_spacing    = 0.5
    dots_rounding   = 4
    dots_center     = true
    dots_text_format = ●

    placeholder_text = PASSWORD
    fade_on_empty    = false
    fade_timeout     = 250

    check_color = $good
    fail_color  = $bad
    check_text  = IDENTITY VERIFIED
    fail_text   = ACCESS DENIED — RETRY

    # Lock states: caps-lock silently breaks passwords often enough to be
    # worth a colour of its own.
    capslock_color = $accent
    numlock_color  = $ice_dim
    bothlock_color = $bad

    position = 0, -20
    halign   = center
    valign   = center
}

# ── hairline below the prompt ─────────────────────────────────────────────
label {
    monitor =
    text  = ──────
    color = $ice_faint

    font_family = $mono
    font_size   = 14

    position   = 0, -126
    halign     = center
    valign     = center
    text_align = center
}

# ── keyboard layout, click to cycle ───────────────────────────────────────
label {
    monitor =
    text  = $LAYOUT
    color = rgba(228, 236, 246, 0.30)

    font_family = $mono
    font_size   = 12
    onclick     = hyprctl switchxkblayout all next

    position = 72, 56
    halign   = left
    valign   = bottom
}

# ── identity ──────────────────────────────────────────────────────────────
label {
    monitor =
    text  = $USER
    color = rgba(228, 236, 246, 0.30)

    font_family = $mono
    font_size   = 12

    position = -72, 56
    halign   = right
    valign   = bottom
}