#
# Version 2.8.3
# DO NOT REMOVE THE REPLACEMENT COMMENTS
# REQUIRED BY THE ML4W SETTINGS APP
# https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/

# general {
#     ignore_dbus_inhibit = false
# }

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = pidof hyprlock || hyprlock    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # to avoid having to press a key twice to turn on the display.
}

# Dim — portable screensaver stage (Omarchy chain: screensaver 150s → lock 300s;
# here: dim 300s → lock 600s → dpms 900s). Exact brightness is saved and restored.
listener {
    # DIMMING TIMEOUT
    timeout = 300
    # DIMMING ONTIMEOUT
    on-timeout = brightnessctl -q g > /tmp/.hypridle_brightness && brightnessctl -q s 20%
    # DIMMING ONRESUME
    on-resume = [ -s /tmp/.hypridle_brightness ] && brightnessctl -q s "$(cat /tmp/.hypridle_brightness)" && rm -f /tmp/.hypridle_brightness
}

# Screenlock
listener {
    # HYPRLOCK TIMEOUT
    timeout = 600
    # HYPRLOCK ONTIMEOUT
    on-timeout = pidof hyprlock || hyprlock
}

# dpms
listener {
    # DPMS TIMEOUT
    timeout = 900
    # DPMS ONTIMEOUT
    # Hyprland 0.55+ parses `hyprctl dispatch` arguments as Lua, so the legacy
    # `dispatch dpms off` form fails outright with
    #   error: [string "return hl.dispatch(dpms off)"]:1: ')' expected near 'off'
    # These three dpms lines had been silently erroring since the Lua migration,
    # which is why the display never blanked on idle.
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    # DPMS ONRESUME
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Suspend — disabled 2026-08-08: resume left the session frozen (see hyprland-suspend/resume
# services + hyprlock#101), causing accidental power-button shutdowns. Re-enable after the
# SIGSTOP suspend hack is removed and a manual `systemctl suspend` survives resume.
