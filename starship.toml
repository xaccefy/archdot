# ponytail: neon cyberpunk palette + Nerd Font icons, two-line prompt
# base #08080c | surface #11111a | text #f5f3ff
# matrix green #00ff41 | cyan #00e5ff | pink #ff2e88 | violet #a259ff
# orange #ff8a00 | muted #77738f

format = """
$hostname\
$directory\
$git_branch\
$git_status\
$git_metrics\
$git_state\
$nodejs\
$python\
$rust\
$golang\
$lua\
$status\
$cmd_duration\
$line_break\
$character"""

add_newline = false

[directory]
style = "fg:#00ff41"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
home_symbol = "~"

[git_branch]
symbol = " "
style = "fg:#00e5ff"
format = "[$symbol$branch]($style) "

[git_status]
style = "fg:#ff2e88"
format = "[$all_status]($style) "

[git_metrics]
added_style = "fg:#00ff41"
deleted_style = "fg:#ff2e88"
format = "[$added$deleted$untracked]($style) "

[hostname]
ssh_only = true
style = "fg:#77738f bold"
format = "[$ssh_symbol]($style) "
ssh_symbol = ""

[git_state]
style = "fg:#a259ff"
format = "[$state( $progress_current/$progress_total)]($style) "

[nodejs]
symbol = " "
style = "fg:#a259ff"
format = "[$symbol($version)]($style) "
detect_files = ["package.json", ".nvmrc"]
detect_folders = ["node_modules"]

[python]
symbol = " "
style = "fg:#ff8a00"
format = "[$symbol($version)]($style) "
detect_files = ["requirements.txt", "pyproject.toml", ".python-version", "setup.py", "Pipfile"]
detect_extensions = ["py"]

[rust]
symbol = " "
style = "fg:#ff2e88"
format = "[$symbol($version)]($style) "

[golang]
symbol = " "
style = "fg:#00e5ff"
format = "[$symbol($version)]($style) "

[lua]
symbol = " "
style = "fg:#a259ff"
format = "[$symbol($version)]($style) "

[status]
disabled = false
style = "bold fg:#ff2e88"
format = "via [$status]($style) "

[cmd_duration]
style = "fg:#ff8a00"
format = "[$duration]($style) "
min_time = 1_000
show_milliseconds = false

[character]
success_symbol = "[λ](bold #00e5ff)"
error_symbol = "[λ](bold #ff2e88)"
vimcmd_symbol = "[λ](#00ff41)"

[package]
disabled = true
