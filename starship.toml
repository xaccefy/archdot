# ponytail: oxocarbon palette + Nerd Font icons, two-line prompt
# base #161616 | surface #262626 | selection #393939 | text #f4f4f4
# teal #08bdba | blue #78a9ff | purple #be95ff | green #42be65
# pink #ee5396 | yellow #f1c21b | orange #ff832b | gray #525252

format = """
$directory\
$git_branch\
$git_status\
$git_state\
$nodejs\
$python\
$rust\
$golang\
$lua\
$fill\
$cmd_duration\
$line_break\
$character"""

add_newline = false

[directory]
style = "fg:#08bdba bold"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"

[git_branch]
symbol = " "
style = "fg:#78a9ff"
format = "[$symbol$branch]($style) "

[git_status]
style = "fg:#ff832b"
format = "[$all_status$ahead_behind]($style) "

[git_state]
style = "fg:#be95ff"
format = "[$state( $progress_current/$progress_total)]($style) "

[fill]
symbol = " "

[nodejs]
symbol = " "
style = "fg:#42be65"
format = "[$symbol($version)]($style) "
detect_files = ["package.json", ".nvmrc"]
detect_folders = ["node_modules"]

[python]
symbol = " "
style = "fg:#f1c21b"
format = "[$symbol($version)]($style) "
detect_files = ["requirements.txt", "pyproject.toml", ".python-version", "setup.py", "Pipfile"]
detect_extensions = ["py"]

[rust]
symbol = " "
style = "fg:#ee5396"
format = "[$symbol($version)]($style) "

[golang]
symbol = " "
style = "fg:#08bdba"
format = "[$symbol($version)]($style) "

[lua]
symbol = " "
style = "fg:#78a9ff"
format = "[$symbol($version)]($style) "

[cmd_duration]
style = "fg:#ff832b"
format = "[$duration]($style) "
min_time = 2_000
show_milliseconds = false

[character]
success_symbol = "[›](bold #08bdba)"
error_symbol = "[›](bold #ee5396)"
vimcmd_symbol = "[‹](bold #78a9ff)"

[package]
disabled = true
