# tmux config — lean, single file, no plugin manager.
# Conventions shared with nvim/init.lua: 2-space soft tabs, split-below/right,
# oxocarbon palette, Wayland text-only clipboard (wl-clipboard).
# Prefix stays C-b — no relearning.

# ── Terminal / truecolor ────────────────────────────────────────
# oxocarbon + termguicolors in nvim need RGB, not the 256-color cube.
# One entry per outer-terminal pattern: foot's terminfo has no Tc flag, so RGB
# must be granted here or nvim falls back to the 256 cube.
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm*:RGB'
set -as terminal-features ',foot*:RGB'

# ── General ─────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 100000
set -g escape-time 0
set -g focus-events on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g renumber-windows on
# Windows AND panes both number from 1. pane-base-index is a separate option
# from base-index and defaults to 0, so it must be set explicitly.
set -g base-index 1
set -g pane-base-index 1
set -g display-time 3000
set -g set-clipboard on
set -g mode-keys vi
# Off by default since tmux 3.3. Lets apps emit passthrough sequences
# (image / graphics protocols) straight to the outer terminal.
set -g allow-passthrough on

# ── Pane / window behaviour ─────────────────────────────────────
# tmux has no splitbelow/splitright option (those are Neovim names).
# Orientation comes from -h/-v below: | splits right, - splits below,
# matching nvim's splitright/splitbelow.
# Style options below are *window* options, hence setw.
# bg=default defers to the terminal instead of painting an opaque colour:
# the outer terminal paints its own translucent background, so an opaque tmux bg
# would hide the wallpaper and clash with it. Do not hardcode a hex here — the
# active/inactive distinction is carried by the status bar instead.
setw -g window-style "bg=default"
setw -g window-active-style "bg=default"
# Activity highlighting: monitor-activity is off by default, so the style alone
# is dead config without it. visual-activity stays off — "on" prints a status
# message on every activity event, which flickers with chatty windows.
setw -g monitor-activity on
setw -g window-status-activity-style "bg=#f57d26"

# ── Clipboard: Wayland via wl-clipboard ─────────────────────────
# Mouse is on, so Shift-drag is needed for native terminal selection.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode    y send-keys -X copy-pipe-and-cancel "wl-copy"
# No -X paste command exists; middle-click pastes the Wayland primary selection.
bind -T copy-mode-vi MouseDown2Pane send-keys -X cancel \; run-shell "wl-paste -p -n 2>/dev/null | tmux load-buffer -" \; paste-buffer -p
# Ctrl-C only in copy-mode -> wl-copy (global C-c would steal SIGINT).
bind -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode C-c send-keys -X copy-pipe-and-cancel "wl-copy"

# vi copy-mode navigation
bind -T copy-mode-vi h send-keys -X cursor-left
bind -T copy-mode-vi j send-keys -X cursor-down
bind -T copy-mode-vi k send-keys -X cursor-up
bind -T copy-mode-vi l send-keys -X cursor-right
bind -T copy-mode-vi w send-keys -X next-word
bind -T copy-mode-vi b send-keys -X previous-word
bind -T copy-mode-vi g send-keys -X history-top
bind -T copy-mode-vi G send-keys -X history-bottom
bind -T copy-mode-vi / command-prompt -P -T search -p "(search down)" { send-keys -X search-forward -- "%%" }
bind -T copy-mode-vi n send-keys -X search-again
bind -T copy-mode-vi N send-keys -X search-reverse

# ── Splits ──────────────────────────────────────────────────────
# | and - are the canonical keys. % and " stay bound as aliases because they
# are tmux's defaults and muscle memory reaches for them; unbinding them made
# C-b % / C-b " fail silently. Both orientations inherit the pane cwd.
bind |  split-window -h -c "#{pane_current_path}"
bind -  split-window -v -c "#{pane_current_path}"
bind %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# ── Layout presets ───────────────────────────────────────────────
# Spawn a fixed arrangement as a NEW window — never splits the current one,
# so running panes are never touched. Both inherit the current pane's cwd.
# 3 = three even columns, 4 = 2x2 grid (tiled evens the cells out).
# Alt+digit, not bare digits: prefix+<digit> is taken by window switching.
bind M-3 new-window -c "#{pane_current_path}" \; \
  split-window -h -c "#{pane_current_path}" \; \
  split-window -h -c "#{pane_current_path}" \; \
  select-layout even-horizontal
bind M-4 new-window -c "#{pane_current_path}" \; \
  split-window -h -c "#{pane_current_path}" \; \
  split-window -v -c "#{pane_current_path}" \; \
  select-pane -t 1 \; \
  split-window -v -c "#{pane_current_path}" \; \
  select-layout tiled \; \
  select-pane -t 1

# ── Pane movement (prefix then Alt/arrow) ───────────────────────
bind M-h select-pane -L
bind M-j select-pane -D
bind M-k select-pane -U
bind M-l select-pane -R
bind -r M-H resize-pane -L 5
bind -r M-J resize-pane -D 5
bind -r M-K resize-pane -U 5
bind -r M-L resize-pane -R 5

# ── Windows / panes ─────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind c new-window -c "#{pane_current_path}"
# rename-window needs an argument; command-prompt supplies it interactively.
# tmux 3.7c rejects a bare `bind & rename-window` at load time.
bind & command-prompt -p "Rename window: " { rename-window "%%" }
bind . break-pane
bind X kill-window
bind x kill-pane

# ── Timer (status-right) ─────────────────────────────────────────
# scripts/tmux-timer.sh owns the logic; state lives in
# ${XDG_RUNTIME_DIR:-/tmp}/tmux-timer-$UID. M-t toggles a count-up timer,
# M-T prompts for minutes for a countdown; at zero the segment flashes green
# until cleared (M-t again, or an empty/0 prompt). With no timer running,
# the slot shows the date. Status redraws every second to drive the timer.
bind M-t run-shell '$HOME/.config/scripts/tmux-timer.sh toggle'
bind M-T command-prompt -p "Countdown minutes (empty clears): " { run-shell '$HOME/.config/scripts/tmux-timer.sh set "%%"' }

# ── Status bar (oxocarbon) ──────────────────────────────────────
# Status bar is bg=default too, so the whole window stays uniformly
# translucent; separation comes from foreground colour, not an opaque fill.
set -g status-style "bg=default,fg=#f2f4f8"
# Bar stays on the bottom (explicit: sourcing the config can only set
# options, never unset them, so a bare removal would silently keep "top").
set -g status-position bottom
# Blocky powerline separators (U+E0B0) instead of thin bars. These are drawn as
# foreground glyphs, not background fills, so the bar stays translucent like the
# rest of the window. No trailing separator in status-left: each window entry
# carries its own leading triangle, otherwise they double up again.
set -g status-left "#[bg=#42be65,fg=#161616,bold] #S #[default] "
set -g status-left-length 40
# Right slot is the timer (see Timer section), not a clock. tmux inserts
# the script's output verbatim, styles included — verified on tmux 3.8.
set -g status-right '#($HOME/.config/scripts/tmux-timer.sh line)'
set -g status-right-length 40
# 1s refresh, not 60: the right slot needs per-second resolution for the
# countdown and its flash at zero.
set -g status-interval 1

# Separators are leading on each entry (no trailing one) so they don't collide.
# Active and inactive must use the SAME "#I:#W" join — mixing "#I #W" here with
# "#I:#W" in the active format rendered as "1:shell work" next to "2 hunting".
# Pane badge only when a window actually has >1 pane; #{?window_panes,...} is
# true for any window with one pane too, which put a useless "(1)" everywhere.
setw -g window-status-current-style "nounderscore"
setw -g window-status-format "#[bg=#525252,fg=#f2f4f8] #I:#W#{?#{>:#{window_panes},1}, (#{window_panes}),} #[default] "
setw -g window-status-current-format "#[bg=#82aaff,fg=#161616,bold] #I:#W#{?#{>:#{window_panes},1}, (#{window_panes}),} #[default] "

set -g message-style "bg=#be95ff,fg=#161616"
set -g message-command-style "bg=default,fg=#f2f4f8"
set -g mode-style "bg=#42be65,fg=#161616,bold"
