<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>

  <!--
    Structured after Omarchy's default/fontconfig/conf.avail/50-omarchy.conf:
    fontconfig is the single source of truth for font *family*, and every
    generic is assigned explicitly rather than left to system defaults.

    Previously only "monospace" and "JetBrains Mono" were aliased here, so
    sans-serif fell through to Noto Sans and nothing supplied Nerd Font or
    emoji fallbacks, so an icon glyph inside a sans-serif string rendered as
    tofu, and the CSS/web family names Chromium and Electron emit
    (system-ui, -apple-system, BlinkMacSystemFont, ui-monospace) resolved
    to whatever fontconfig guessed.
  -->

  <!-- ==================== generics ==================== -->

  <!-- Kept ahead of sans-serif deliberately. The system's 49-sansserif.conf
       loads at position 49, before the user config at 50, and appends
       "sans-serif" to the family list of any pattern with no generic name. A
       strong assign replaces the entire list, so if the sans-serif rule below
       ran first it would drop "ui-monospace" before this rule could test for
       it. Verify changes with `fc-match ':family=ui-monospace'`, because the
       bare `fc-match ui-monospace` form mis-parses the leading "ui-" and
       reports the proportional face whatever the config says. -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>ui-monospace</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>

  <!-- One family for the entire desktop: the plain "Nerd Font" build, matching
       gtk-font-name, qt6ct, waybar and ghostty. Not the Propo build, which
       differs only in letting icon glyphs take their natural width (U+F120 is
       1038 units there vs 600 here) and in dropping spacing=100 so apps treat
       it as proportional. The letters are identical 600 units in every
       variant, because JetBrains Mono is monospace throughout. -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>

  <!-- JetBrains ships no serif face, so "serif" gets the same family as
       sans-serif. Deliberate: one typeface across the whole desktop was the
       goal, and a document asking for serif is asking for body text rather
       than specifically for slabs. -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>serif</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>monospace</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>

  <!-- Apps that name the upstream family get the installed Nerd Font build. -->
  <alias>
    <family>JetBrains Mono</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
    </prefer>
  </alias>

  <!-- ==================== web / CSS family names ==================== -->
  <!-- Chromium, Electron and modern CSS resets ask for these by name. -->

  <alias>
    <family>system-ui</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
    </prefer>
  </alias>

  <alias>
    <family>-apple-system</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
    </prefer>
  </alias>

  <alias>
    <family>BlinkMacSystemFont</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
    </prefer>
  </alias>

  <!-- ==================== coverage fallbacks ==================== -->
  <!--
    JetBrains covers Latin, Cyrillic and Greek but not CJK, Arabic, Devanagari
    or emoji. "accept" appends these behind whatever the app actually asked
    for, and charset matching outranks family matching, so a font that cannot
    render a codepoint is never pulled in ahead of one that can. Without this,
    assigning sans-serif strongly to JetBrains would produce tofu for every
    script it lacks.
  -->

  <alias>
    <family>sans-serif</family>
    <accept>
      <family>Noto Sans</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Naskh Arabic</family>
      <family>Noto Sans Devanagari</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>

  <alias>
    <family>serif</family>
    <accept>
      <family>Noto Sans CJK SC</family>
      <family>Noto Naskh Arabic</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>

  <alias>
    <family>monospace</family>
    <accept>
      <family>Noto Sans Mono</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>

  <!-- Arabic: prefer Naskh (standard Arabic) over whatever charset matching
       lands on first, which was DejaVu Sans. Same rule Omarchy carries. -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ar</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Naskh Arabic</string>
    </edit>
  </match>

  <!--
    Chromium and Electron resolve missing glyphs one character at a time
    without lang on the pattern, so the aliases above never fire for them.
    Naming these as last-resort families covers that path; appending keeps
    them behind every family the app actually requested.
  -->
  <match target="pattern">
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <edit name="family" mode="append" binding="strong">
      <string>Noto Naskh Arabic</string>
    </edit>
  </match>

  <match target="pattern">
    <edit name="family" mode="append" binding="strong">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- ==================== rendering ==================== -->
  <!-- Unchanged from the previous file: subpixel RGB, full hinting,
       antialiasing, and synthetic oblique/bold for faces that lack them. -->

  <!-- Artificial oblique for fonts without an italic or oblique version -->
  <match target="font">
    <test name="slant">
      <const>roman</const>
    </test>
    <test compare="not_eq" name="slant" target="pattern">
      <const>roman</const>
    </test>
    <edit mode="assign" name="matrix">
      <times>
        <name>matrix</name>
        <matrix>
          <double>1</double>
          <double>0.2</double>
          <double>0</double>
          <double>1</double>
        </matrix>
      </times>
    </edit>
    <edit mode="assign" name="slant">
      <const>oblique</const>
    </edit>
    <edit mode="assign" name="embeddedbitmap">
      <bool>false</bool>
    </edit>
  </match>

  <!-- Synthetic emboldening for fonts with no bold face -->
  <match target="font">
    <test compare="less_eq" name="weight">
      <const>medium</const>
    </test>
    <test compare="more_eq" name="weight" target="pattern">
      <const>bold</const>
    </test>
    <edit mode="assign" name="embolden">
      <bool>true</bool>
    </edit>
    <edit mode="assign" name="weight">
      <const>bold</const>
    </edit>
  </match>

  <match target="font">
    <edit mode="assign" name="rgba">
      <const>rgb</const>
    </edit>
  </match>

  <match target="font">
    <edit mode="assign" name="lcdfilter">
      <const>lcddefault</const>
    </edit>
  </match>

  <match target="font">
    <edit mode="assign" name="hinting">
      <bool>true</bool>
    </edit>
  </match>

  <match target="font">
    <edit mode="assign" name="hintstyle">
      <const>hintfull</const>
    </edit>
  </match>

  <match target="font">
    <edit mode="assign" name="antialias">
      <bool>true</bool>
    </edit>
  </match>

</fontconfig>
